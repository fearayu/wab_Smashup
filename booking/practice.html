<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จองสนามซ้อม | SMASHUP</title><link rel="stylesheet" href="topic.css"><link rel="stylesheet" href="service-form.css"></head><body><header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">SU</span><span><strong>SMASHUP</strong><small>BADMINTON PROJECT</small></span></a><a class="back" href="court-booking.html">← หน้าจองสนาม</a></header><main class="topic-main service-page"><section class="service-hero"><p class="eyebrow">07 / PRACTICE COURT</p><h1>จองสนาม<br><em>ซ้อม</em></h1><p>ส่งคำขอจองพื้นที่ฝึกซ้อมส่วนตัวหรือเป็นทีม แล้วทีมงานจะยืนยันรอบให้คุณ</p></section><section class="service-layout"><form id="serviceForm" class="service-form"><h2>ข้อมูลการซ้อม</h2><input type="hidden" name="service" value="จองสนามซ้อม"><div class="service-grid"><label>วันที่ <b>*</b><input name="date" type="date" required></label><label>เวลา <b>*</b><select name="time" required><option value="">เลือกเวลา</option><option>11:00–13:00</option><option>15:00–17:00</option><option>19:00–21:00</option></select></label><label>จำนวนผู้เล่น <b>*</b><input name="players" type="number" min="1" required></label><label>ชื่อผู้จอง <b>*</b><input name="name" required></label><label>เบอร์โทรศัพท์ <b>*</b><input name="phone" type="tel" placeholder="08X-XXX-XXXX" required></label></div><label>วัตถุประสงค์การซ้อม<textarea name="note" rows="3" placeholder="เช่น ซ้อมทีม หรือเรียนพื้นฐาน"></textarea></label><button type="submit">ส่งคำขอจองสนามซ้อม ↗</button><p id="serviceMessage" class="service-message" role="status"></p></form><aside class="service-note"><h2>สนามซ้อม</h2><p>เหมาะสำหรับการซ้อมเดี่ยว ซ้อมเป็นคู่ หรือฝึกทีมขนาดเล็ก</p><ul><li>แจ้งจำนวนผู้เล่นก่อนจอง</li><li>ยืนยันรอบผ่านทีมงาน</li></ul></aside></section></main><script src="topic-nav.js"></script><script src="service-form.js"></script></body></html>
