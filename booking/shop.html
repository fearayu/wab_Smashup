<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ลงชื่อซื้อของ | SMASHUP</title><link rel="stylesheet" href="topic.css"><link rel="stylesheet" href="service-form.css"></head><body><header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">SU</span><span><strong>SMASHUP</strong><small>BADMINTON PROJECT</small></span></a><a class="back" href="court-booking.html">← หน้าจองสนาม</a></header><main class="topic-main service-page"><section class="service-hero"><p class="eyebrow">08 / SHOP REGISTER</p><h1>ลงชื่อ<br><em>ซื้อของ</em></h1><p>แจ้งรายการสินค้าที่ต้องการ เพื่อให้ทีมงานเตรียมสินค้าและยืนยันยอดชำระ</p></section><section class="service-layout"><form id="serviceForm" class="service-form"><h2>ลงทะเบียนซื้อสินค้า</h2><input type="hidden" name="service" value="ลงชื่อซื้อของ"><div class="service-grid"><label>ชื่อผู้ซื้อ <b>*</b><input name="name" required></label><label>เบอร์โทรศัพท์ <b>*</b><input name="phone" type="tel" placeholder="08X-XXX-XXXX" required></label><label>สินค้า <b>*</b><select name="item" required><option value="">เลือกรายการ</option><option>ลูกแบดมินตัน</option><option>กริ๊ปไม้แบด</option><option>เสื้อ SMASHUP</option></select></label><label>จำนวน <b>*</b><input name="quantity" type="number" min="1" value="1" required></label></div><label>หมายเหตุ<textarea name="note" rows="3" placeholder="เช่น สี/ขนาด ที่ต้องการ"></textarea></label><button type="submit">ส่งรายการสินค้า ↗</button><p id="serviceMessage" class="service-message" role="status"></p></form><aside class="service-note"><h2>การรับสินค้า</h2><p>หลังจากทีมงานยืนยันรายการ คุณสามารถชำระและรับสินค้าที่เคาน์เตอร์สนามได้</p></aside></section></main><script src="topic-nav.js"></script><script src="service-form.js"></script></body></html>
