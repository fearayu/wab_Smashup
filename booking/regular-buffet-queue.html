<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>คิวตีบุฟเฟต์ | SMASHUP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="topic.css">
  <link rel="stylesheet" href="regular-buffet-queue.css">
  <link rel="stylesheet" href="regular-buffet-queue-hero.css">
<style>/* mobile queue card */@media(max-width:760px){.queue-labels{display:none}.queue-list{gap:10px}.queue-row{border-radius:10px;display:grid;grid-template-columns:42px 1fr;gap:8px;min-height:0;padding:11px}.queue-number{grid-row:1/3;height:100%}.queue-player{font-size:14px;font-weight:600}.queue-shuttle,.queue-court{height:34px;text-align:center}.queue-shuttle,.queue-court{grid-column:2;width:100%}}</style></head>
<body>
  <header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">SU</span><span><strong>SMASHUP</strong><small>BADMINTON PROJECT</small></span></a><a class="back" href="court-booking.html">← หน้าจองสนาม</a></header>
  <main class="topic-main queue-page">
    <div class="queue-heading"><div><p class="eyebrow">05 / BUFFET QUEUE</p><h1>จัดคิวตี<br><em>บุฟเฟต์</em></h1><p>เลือกผู้เล่นจากรายการรอ แล้วจัดเข้าคิวลงสนามได้ทันที</p></div><button class="refresh-button" id="refreshQueue" type="button">↻ รีเฟรช</button></div>
    <section class="queue-layout" aria-label="ระบบจัดคิวตีบุฟเฟต์">
      <article class="queue-panel playing-panel"><div class="panel-title"><h2>คิวการเล่น</h2><span id="queueCount">0 / 30 คิว</span></div><div class="queue-labels"><span>คิว</span><span>ชื่อผู้เล่น</span><span>ลูก</span><span>สนาม</span></div><div class="queue-list" id="queueList"></div></article>
      <div class="right-column">
        <article class="queue-panel waiting-panel"><div class="panel-title"><h2>รอจัดคิว</h2><span id="waitingCount">0 คน</span></div><form class="waiting-form" id="waitingForm"><label>ชื่อเล่น<input id="playerName" name="playerName" maxlength="30" required placeholder="เช่น มินท์"></label><label>ลูก<select id="shuttleCount" name="shuttleCount"><option value="0">0 ลูก</option><option value="1">1 ลูก</option><option value="2">2 ลูก</option><option value="3">3 ลูก</option></select></label><button type="submit">+ เพิ่มเข้ารอ</button></form><div class="waiting-list" id="waitingList"><p class="empty-state">ไม่พบข้อมูล</p></div></article>
        <article class="queue-panel history-panel"><div class="panel-title"><h2>ประวัติ</h2><span>รอบล่าสุด</span></div><div class="history-scroll"><table><thead><tr><th>#</th><th>คิว</th><th>ชื่อผู้เล่น</th><th>ลูก</th><th>สนาม</th><th>เวลา</th></tr></thead><tbody id="historyList"><tr><td colspan="6" class="empty-state">ยังไม่มีประวัติ</td></tr></tbody></table></div></article>
      </div>
    </section>
  </main>
  <script src="topic-nav.js"></script>
  <script src="../shared/utils.js"></script><script src="../shared/service-rules.js"></script><script src="regular-buffet-queue.js"></script>
</body>
</html>
