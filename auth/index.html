<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>เข้าสู่ระบบ | SMASHUP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-page"><a class="brand" href="../index.html"><span class="brand-mark">SU</span><span><strong>SMASHUP</strong><small>BADMINTON PROJECT</small></span></a><section class="auth-card"><p class="eyebrow">MEMBER ACCESS</p><h1 id="formTitle">เข้าสู่ระบบ</h1><p class="intro" id="formDescription">เข้าสู่ระบบเพื่อจัดการการจองและข้อมูลผู้เล่นของคุณ</p><form id="authForm" novalidate><label>Username<input id="username" autocomplete="username" maxlength="30" required placeholder="เช่น smashup_player"></label><label id="emailField" hidden>อีเมล<input id="email" type="email" autocomplete="email" placeholder="name@example.com"></label><label>รหัสผ่าน<input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="อย่างน้อย 6 ตัวอักษร"></label><button type="submit" id="submitButton">เข้าสู่ระบบ</button><p class="feedback" id="feedback" role="status"></p></form><p class="switch-copy" id="switchCopy">ยังไม่มีบัญชี? <button id="switchMode" type="button">สมัครสมาชิก</button></p><p class="demo-note">เวอร์ชันต้นแบบ: บัญชีถูกเก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น</p></section></main><script src="auth.js"></script>
</body>
</html>
