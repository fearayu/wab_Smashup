name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-backend:
    name: Backend - Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Lambda bundle
        run: npm run build:lambda

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-bundle
          path: backend/dist/lambda/

  check-frontend:
    name: Frontend - Site files check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required site files exist
        run: |
          for f in index.html admin/index.html admin/admin.js auth/index.html auth/auth.js booking/index.html booking/booking.js matching/index.html matching/matching.js shared/app-shell.css shared/auth-ui.js; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
          echo "Static site structure OK"

  deploy-backend:
    name: Deploy Backend - Cloudflare Workers
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure wrangler.jsonc from secrets (if available)
        run: |
          if [ -n "${{ secrets.D1_DATABASE_ID }}" ] && [ -n "${{ secrets.KV_NAMESPACE_ID }}" ]; then
            cp wrangler.example.jsonc wrangler.jsonc
            sed -i "s/<REPLACE_WITH_D1_DATABASE_ID>/${{ secrets.D1_DATABASE_ID }}/g" wrangler.jsonc
            sed -i "s/<REPLACE_WITH_KV_NAMESPACE_ID>/${{ secrets.KV_NAMESPACE_ID }}/g" wrangler.jsonc
            echo "Using secrets for D1/KV IDs"
          else
            echo "Secrets not set - using existing wrangler.jsonc with hardcoded IDs"
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply wab_Smashup-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        id: deploy
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-out.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' /tmp/wrangler-out.txt | head -1)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Show deployment URL
        run: echo "Backend deployed to ${{ steps.deploy.outputs.deployment-url }}"

  deploy-frontend:
    name: Deploy Frontend - Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [check-frontend, deploy-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        run: |
          set -o pipefail
          npx wrangler pages deploy . \
            --project-name=${{ secrets.PAGES_PROJECT_NAME }} \
            --branch=main \
            --commit-dirty=true \
            --commit-message="Deploy from GitHub Actions"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Show deployment URL
        run: echo "Frontend deployed to https://${{ secrets.PAGES_PROJECT_NAME }}.pages.dev"